<div class="login-page">

  <!-- Subtle background pattern -->
  <div class="login-bg-pattern" aria-hidden="true"></div>

  <div class="login-card">

    <!-- Brand -->
    <div class="login-brand">
      <img src="assets/ClubIcon.png" class="brand-logo" alt="Club de la Unión" />
      <h2 class="welcome-title">Bienvenido</h2>
    </div>

    <div class="login-divider"></div>

    <!-- Form -->
    <form [formGroup]="form" (ngSubmit)="submit()">

      <div class="field-group mb-3">
        <label for="identification" class="field-label">Identificación</label>
        <input
          id="identification"
          type="text"
          class="field-input"
          [class.field-invalid]="form.get('identification')?.invalid && form.get('identification')?.touched"
          formControlName="identification"
          autocomplete="username"
          placeholder="Número de identificación"
        />
        <span *ngIf="form.get('identification')?.invalid && form.get('identification')?.touched" class="field-error">
          La identificación es requerida.
        </span>
      </div>

      <div class="field-group mb-4">
        <label for="password" class="field-label">Contraseña</label>
        <div class="pw-field-wrap">
          <input
            id="password"
            [type]="showPassword ? 'text' : 'password'"
            class="field-input"
            [class.field-invalid]="form.get('password')?.invalid && form.get('password')?.touched"
            formControlName="password"
            autocomplete="current-password"
            placeholder="••••••••"
          />
          <button type="button" class="pw-toggle" (click)="togglePassword()" tabindex="-1"
            [attr.aria-label]="showPassword ? 'Ocultar contraseña' : 'Mostrar contraseña'">
            <i class="bi" [ngClass]="showPassword ? 'bi-eye-slash' : 'bi-eye'"></i>
          </button>
        </div>
        <span *ngIf="form.get('password')?.invalid && form.get('password')?.touched" class="field-error">
          La contraseña es requerida.
        </span>
      </div>

      <button type="submit" class="login-btn" [disabled]="loading">
        <span *ngIf="loading" class="spinner-border spinner-border-sm me-2"></span>
        <span>{{ loading ? 'Verificando...' : 'Ingresar' }}</span>
        <i *ngIf="!loading"></i>
      </button>

    </form>

  </div>
</div>
