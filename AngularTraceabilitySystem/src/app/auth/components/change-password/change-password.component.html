<div class="d-flex align-items-center justify-content-center min-vh-100 bg-light">
  <div class="card shadow-sm change-password-card">
    <div class="card-body p-4">

      <div class="text-center mb-4">
        <i class="bi bi-lock-fill fs-2 icon-accent"></i>
        <h5 class="fw-bold mt-2">Cambiar contraseña</h5>
        <p class="text-muted small">Tu cuenta requiere una nueva contraseña.</p>
      </div>

      <form [formGroup]="form" (ngSubmit)="submit()">
        <div class="mb-4">
          <label for="newPassword" class="form-label">Nueva contraseña</label>
          <input
            id="newPassword"
            type="password"
            class="form-control"
            formControlName="newPassword"
            [class.is-invalid]="form.get('newPassword')?.invalid && form.get('newPassword')?.touched"
            autocomplete="new-password"
          />
          <div class="invalid-feedback">Mínimo 6 caracteres.</div>
        </div>

        <div *ngIf="errorMsg" class="alert alert-danger py-2 small">{{ errorMsg }}</div>

        <button type="submit" class="btn btn-dark w-100" [disabled]="loading">
          <span *ngIf="loading" class="spinner-border spinner-border-sm me-2"></span>
          Confirmar contraseña
        </button>
      </form>

    </div>
  </div>
</div>
