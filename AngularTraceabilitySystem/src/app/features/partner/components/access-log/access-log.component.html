<div class="access-log-page">

  <div *ngIf="loading" class="loading-wrap">
    <div class="spinner-border spinner-gold"></div>
  </div>

  <div *ngIf="!loading && error" class="alert alert-danger m-4">{{ error }}</div>

  <ng-container *ngIf="!loading && !error">

    <header class="page-header">
      <h1 class="page-title">
        <i class="bi bi-clock-history me-2 icon-accent"></i>Historial de accesos
      </h1>
    </header>

    <div *ngIf="totalElements === 0" class="empty-state">
      <i class="bi bi-clock-history"></i>
      <p>No tienes accesos registrados por el momento.</p>
    </div>

    <div *ngIf="totalElements > 0" class="login-list">
      <div *ngFor="let l of logins" class="login-card">
        <div class="login-icon-wrap">
          <i class="bi bi-box-arrow-in-right"></i>
        </div>
        <div class="login-body">
          <div class="login-meta">
            <span><i class="bi bi-clock"></i>{{ formatDateTime(l.timestamp) }}</span>
            <span><i class="bi bi-geo-alt"></i>{{ l.ip }}</span>
          </div>
        </div>
      </div>
    </div>

    <app-paginator *ngIf="logins.length" [currentPage]="currentPage" [totalPages]="totalPages" (pageChange)="goToPage($event)"></app-paginator>

  </ng-container>

</div>
