<div class="notifications-page">

  <!-- Loading -->
  <div *ngIf="loading" class="loading-wrap">
    <div class="spinner-border spinner-gold"></div>
  </div>

  <!-- Error -->
  <div *ngIf="!loading && error" class="alert alert-danger m-4">{{ error }}</div>

  <ng-container *ngIf="!loading && !error">

    <!-- ── Page header ── -->
    <header class="page-header">
      <h1 class="page-title">
        <i class="bi bi-bell me-2 icon-accent"></i>Mis Notificaciones
      </h1>
    </header>

    <!-- ── Empty state ── -->
    <div *ngIf="notifications.length === 0" class="empty-state">
      <i class="bi bi-bell-slash"></i>
      <p>No tienes notificaciones por el momento.</p>
    </div>

    <!-- ── Notification list ── -->
    <div *ngIf="notifications.length > 0" class="notif-list">
      <div *ngFor="let n of notifications" class="notif-card">

        <div class="notif-icon-wrap">
          <i class="bi bi-receipt"></i>
        </div>

        <div class="notif-body">
          <p class="notif-title">{{ n.title }}</p>
          <p class="notif-text">{{ n.body }}</p>
          <div class="notif-meta">
            <span>
              <i class="bi bi-house-door"></i>{{ n.environment }}
            </span>
            <span>
              <i class="bi bi-clock"></i>{{ formatDateTime(n.generationDate) }}
            </span>
          </div>
        </div>

        <span class="notif-amount">{{ formatCurrency(n.totalAmount) }}</span>

      </div>
    </div>

  </ng-container>

</div>
